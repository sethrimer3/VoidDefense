<!doctype html>
<html lang="en" class="game-loading pixel-font">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0b09" />
    <meta
      name="description"
      content="A futuristic metropolitan city-defense game against an expanding cosmic void."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Void Defense" />
    <meta
      property="og:description"
      content="A mobile-first cosmic city-defense game. Hold a procedural metropolis against an expanding Void."
    />
    <meta property="og:image" content="./og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Void Defense" />
    <meta
      name="twitter:description"
      content="A mobile-first cosmic city-defense game. Hold a procedural metropolis against an expanding Void."
    />
    <meta name="twitter:image" content="./og-image.png" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="./GameIcon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Void Defense</title>
  </head>
  <body>
    <div id="loading-screen" role="status" aria-label="Loading game">
      <canvas class="loading-stones" aria-hidden="true"></canvas>
      <div class="loading-brand" aria-hidden="true">
        <div class="loading-title">VOID DEFENSE</div>
        <div class="loading-sub">YEAR 3000 // METROPOLITAN CONTAINMENT</div>
      </div>
      <div class="loading-corner" aria-hidden="true">
        <span class="loading-label">loading<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></span>
        <canvas class="loading-bar"></canvas>
      </div>
      <button class="loading-retry" type="button" hidden>Try again</button>
    </div>
    <div id="app" inert aria-busy="true"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
